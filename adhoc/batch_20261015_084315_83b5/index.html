<script>const REPORT_MD = "# 集束分析 · 20 条\n\n## 📊 一、整体画像\n\n本批 20 条素材高度集中于**熟龄女性抗衰护肤**赛道，商品指向以\"抗皱、紧致、水光\"为核心卖点的护肤产品（面膜/精华类），目标人群锁定 30-50 岁、存在\"断崖式衰老\"焦虑的女性用户。从消耗分布看，头部效应显著：消耗 TOP5 合计约 142.19，占全批总消耗（约 307.53）的 46% 以上，其中 #1 以 67.84 的消耗断层领先，是第二名 #2（20.81）的 3.3 倍，说明该素材已跑出明显的\"爆量模板\"特征。\n\n开篇类型分布呈现**明星背书一家独大**的格局：明星背书类 13 条（65%），达人开篇 3 条（15%），营销福利 3 条（15%），痛点对比仅 1 条（5%）。这一结构与消耗排名高度吻合——TOP5 中 4 条为明星背书开篇，验证了明星资源在当前素材体系中的核心驱动地位。\n\n| 维度 | 分布 | 占比/频次 |\n|---|---|---|\n| 明星背书开篇 | 13 条 | 65% |\n| 达人开篇 | 3 条 | 15% |\n| 营销福利开篇 | 3 条 | 15% |\n| 痛点对比开篇 | 1 条 | 5% |\n| 消耗 TOP1 | #1（67.84） | 断层领先 |\n| 核心明星 | 秦海璐 | 11 次 |\n| 次核心明星 | 林心如/王鸥/吴昕 | 6/5/4 次 |\n\n达人侧呈现\"明星矩阵 + 素人街采\"的双层结构：明星负责信任背书与权威感，素人负责\"她和我一样\"的代入感，两者在绝大多数素材中交替出现，形成\"权威种草 + 真实证言\"的完整说服链条。玩法上，直播间切片、街头采访、居家护肤演示是三大高频场景，叠加\"限时福利\"\"买赠\"\"价格悬念\"等促销钩子，构成\"信任 + 痛点 + 福利\"的三角驱动模型。\n\n## 🔥 二、共性归因（6 条）\n\n- ✅ **明星矩阵背书是消耗第一驱动力**：13 条明星背书素材贡献了绝大部分消耗，秦海璐以 11 次出场成为绝对核心，其\"影后身份 + 贵气外形 + 熟龄匹配\"三重属性构成强信任锚点（#1 #3 #6 #7 #8 #9 #11 #14 #16）。明星背书直接降低用户决策门槛，是高完播率的第一保障。\n\n- ✅ **\"断崖式衰老\"是统一痛点话术**：几乎所有素材都围绕\"断崖式衰老\"\"松弛下垂\"\"皱纹细纹\"\"暗沉垮脸\"展开，用\"10 年皱纹、20 年皱纹、30 年皱纹\"的分层话术强化焦虑（#5 #19），将抽象的\"抗老\"转化为具象的\"脸垮、有纹、往下坠\"，痛点表达高度同质化但有效。\n\n- ✅ **多场景切换去广告化**：直播间 + 街头采访 + 居家护肤是最高频的场景组合，通过场景快速切换打破单一广告感，营造\"真实生活记录\"的观感（#1 #2 #3 #7 #14 #16）。街采素人的\"脸在发光\"\"自然透亮\"口述成为效果呈现的标配。\n\n- ✅ **\"她在用我也想要\"的代入逻辑**：明星与素人的组合刻意制造\"同龄人\"参照系，明星负责\"她 40+ 皮肤还这么好\"，素人负责\"她和我一样\"，双重投射锁定目标用户心理（#2 #12 #14 #15 #16）。\n\n- ✅ **效果可视化是转化临门一脚**：几乎所有素材都强调\"即时效果\"——水光肌特写、皮肤弹性按压、喷了 vs 没喷对比、放大镜看脸等（#2 #3 #4 #17 #18），用肉眼可见的变化承接痛点，完成\"焦虑—方案—效果\"的闭环。\n\n- ✅ **福利钩子贯穿始终**：限时抢购、买赠、价格悬念、整箱囤货等促销元素高频出现（#5 #8 #9 #10 #11 #12 #13 #15），在信任与痛点铺垫完成后用价格刺激收口，形成\"信任—焦虑—福利\"的完整转化链路。\n\n## ⚡ 三、开篇钩子分析\n\n### 3.1 明星背书开篇（13 条，65%）\n\n这是本批素材的绝对主力，也是消耗 TOP5 中 4 条的共同选择。其 3 秒钩子逻辑是**\"熟面孔 + 强身份\"的瞬间信任激活**：秦海璐、邓亚萍、黄晓明、林心如等国民级明星在开篇第一帧即出现，利用观众对明星的既有认知跳过\"你是谁\"的信任建立环节，直接进入\"她推荐的应该靠谱\"的心理预设。其中 #1 的\"明星 × 直播连线开篇\"表现最优，直播连线的即时感与明星真实反应叠加，制造\"正在发生\"的临场感，是 67.84 高消耗的核心钩子。#3 的\"明星口播 × 饥饿营销\"、#10 的\"明星口播 × 悬念福利\"则在明星基础上叠加稀缺性，进一步拉高前 3 秒的停留意愿。\n\n### 3.2 达人开篇（3 条，15%）\n\n达人开篇的钩子逻辑是**\"人设信任 + 防伪背书\"**。#2 以\"人设口播 × 防伪信任背书\"开篇，用达人专业人设建立\"她懂行\"的信任；#20 引入向佐男性视角口播，制造性别反差与\"专业可信\"的背书感；#15 则以\"达人囤货 × 福利引流\"切入，用豪华浴室囤货场景制造视觉冲击。达人开篇的消耗表现（#2 为 20.81，居第二）说明在明星资源之外，强人设达人同样具备跑量能力，但整体消耗规模不及明星矩阵。\n\n### 3.3 营销福利开篇（3 条，15%）\n\n营销福利开篇以**\"产品堆叠 + 价格冲击\"**为 3 秒钩子核心。#5 的\"产品堆叠 × 价格冲击\"、#12 的\"产品开箱 × 买赠福利\"、#13 的\"价格悬念 × 产品堆叠\"，均以大量产品视觉堆叠和价格悬念制造\"超值感\"，直接刺激价格敏感型用户。这类开篇的消耗集中在 9-16 区间，属于稳定跑量的第二梯队。\n\n### 3.4 痛点对比开篇（1 条，5%）\n\n#18 是唯一的痛点对比开篇，以\"皮肤痛点 × 效果对比\"切入，用素人腹部皱纹痛点展示 + 效果对比制造视觉冲击。虽然消耗仅 7.47，但其\"痛点可视化\"的钩子逻辑具有差异化价值，值得在后续素材中放大测试。\n\n| 开篇类型 | 条数 | 3 秒钩子核心 | 消耗区间 |\n|---|---|---|---|\n| 明星背书 | 13 | 熟面孔瞬间信任激活 | 7.1-67.8 |\n| 达人开篇 | 3 | 人设信任 + 防伪背书 | 7.1-20.8 |\n| 营销福利 | 3 | 产品堆叠 + 价格冲击 | 9.5-16.1 |\n| 痛点对比 | 1 | 痛点可视化对比 | 7.5 |\n\n## 💎 四、表达手法\n\n### 4.1 模特画像：明星矩阵 + 素人达人的双层结构\n\n本批素材的模特策略呈现清晰的**\"明星金字塔 + 素人基座\"**结构。秦海璐以 11 次出场构成金字塔尖，其\"影后身份 + 贵气外形 + 40+ 熟龄\"三重属性与目标用户高度重合，是\"同龄信任感\"的最强载体（#1 #3 #6 #7 #8 #9 #11 #14 #16）。林心如（6 次）、王鸥（5 次）、吴昕（4 次）构成第二梯队，覆盖不同年龄层与气质类型，扩大信任覆盖面。邓亚萍作为奥运冠军的\"国民度 + 权威感\"是差异化补充（#3 #10 #19），黄晓明、向佐的男性视角则制造性别反差（#4 #10 #20）。\n\n素人侧刻意选用\"多位不同年龄段女性\"，覆盖年轻到熟龄，强化\"她和我一样\"的代入感（#2 #12 #14 #18）。明星与素人的交替出现形成\"权威种草 + 真实证言\"的双重说服，这是本批素材在模特画像上最突出的共性特征。\n\n### 4.2 场景化痛点构造：从抽象焦虑到具象画面\n\n痛点表达的核心手法是**\"场景化具象\"**——将\"抗老\"这一抽象需求转化为可感知的具体画面。\"断崖式衰老\"作为统一话术反复出现（#3 #4 #5 #13 #14 #15 #16 #17 #20），配合\"脸垮下垂\"\"肉往下坠\"\"法令纹\"\"卡粉卡纹\"等具象描述，让用户\"看见\"自己的焦虑。分层话术\"10 年皱纹、20 年皱纹、30 年皱纹\"（#5 #19）进一步将痛点按年龄细分，精准匹配不同阶段用户。\n\n场景构造上，**直播间 + 街头采访 + 居家护肤**的三场景组合是最高频配置：直播间提供明星权威背书与促销氛围，街头采访提供素人真实证言，居家护肤提供产品使用演示。三场景快速切换打破广告感，营造\"真实记录\"的观感（#1 #2 #3 #7 #14 #16）。#18 的游艇户外实测、#15 的豪华浴室囤货则是场景差异化的尝试，但整体仍以\"去广告化的生活感\"为主线。\n\n### 4.3 效果呈现：即时可视化的说服闭环\n\n效果呈现手法高度统一，核心是**\"即时可视化\"**：水光肌特写、皮肤弹性按压、喷了 vs 没喷对比、放大镜看脸、第二天照镜子等（#2 #3 #4 #17 #18）。这些手法将\"效果\"从承诺变为\"可见证据\"，在痛点铺垫后形成\"焦虑—方案—效果\"的完整闭环，是转化前的临门一脚。\n\n## 🎯 五、CTA 分析\n\n### 5.1 福利引流型 CTA（高频）\n\n这是本批素材最主流的 CTA 类型，以**\"限时 + 买赠 + 价格悬念\"**为核心话术。#8、#9、#14、#16、#17 均以\"明星口播福利引流\"收口，在明星信任与痛点铺垫完成后，用\"限时抢购\"\"买赠福利\"制造紧 function escapeAttr(s){return String(s==null?"":s).replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function _buildRef(n, items){
  const idxToItem = new Map();
  items.forEach((it, i) => idxToItem.set((it && it._ref_idx) || (i + 1), it));
  const it = idxToItem.get(n);
  if(!it) return '<span class="ref-miss">#'+n+'</span>';
  const md5 = it.md5 || "";
  const isValidMd5 = md5 && /^[0-9a-fA-F]{32}$/.test(md5);
  const cover = it._cover_url || "";
  const vurl = (it.video_url || "").replace(/"/g, "%22").replace(/'/g, "%27");
  const title = ('#'+n+' '+(it["客户简称"]||"")+' '+(it["拓品品类名称"]||it["商品类型"]||"")).trim();
  const thumb = cover ? '<img class="ref-thumb" src="'+escapeAttr(cover)+'" loading="lazy" alt="#'+n+'" onerror="this.style.display=\'none\'"/>' : "";
  if(vurl){ return '<a class="ref" href="'+escapeAttr(vurl)+'" target="_blank" rel="noopener" title="'+escapeAttr(title)+'"><span class="ref-num">#'+n+'</span>'+thumb+'</a>'; }
  return '<span class="ref" title="'+escapeAttr(title)+'"><span class="ref-num">#'+n+'</span>'+thumb+'</span>';
}
function replaceHashRefs(input, items){
  if(!input || !items || !items.length) return input || "";
  const replaceInText = (text) => text.replace(/#(\d+)\b/g, (_, nStr) => _buildRef(parseInt(nStr, 10), items));
  return String(input).split(/(<[^>]+>)/g).map((seg) => seg.startsWith("<") ? seg : replaceInText(seg)).join("");
}

function escapeHTML(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const _HL_METRICS = [["点击","#4f8cff"],["点赞","#22c55e"],["转发","#f59e0b"],["流失","#ef4444"]];
const _HL_BURST = {"点击":"点击爆点","点赞":"点赞爆点","转发":"转发爆点","流失":"最大流失点"};
const _HLG = {W:560,H:180,PL:40,PR:14,PT:14,PB:26};

function _hlFmtSec(ms){ ms=+ms||0; return ms>=1000 ? (ms%1000?(ms/1000).toFixed(1):(ms/1000|0))+"s" : (ms|0)+"ms"; }

// 把「完整脚本」按 "0-3s：xxx" / "3~8秒 xxx" 切成带起止秒的句子单元
function _hlParseScript(analysis){
  const full = String((analysis&&(analysis.完整脚本||analysis.脚本拆解))||"");
  const units = [];
  const re = /(?:^|\n)\s*[-*#>\d.、]*\s*(\d+(?:\.\d+)?)\s*(?:s|秒)?\s*(?:-|~|～|至|到)\s*(\d+(?:\.\d+)?)\s*(?:s|秒)?\s*[：:]?\s*([^\n]+)/gi;
  let m;
  while((m = re.exec(full))){
    units.push({start:+m[1], end:+m[2], text:m[3].replace(/\s+/g," ").replace(/^[-*：:\s]+/,"").trim()});
  }
  return units;
}

function _hlChartSVG(node){
  const s = (node.series||[]).slice().sort((a,b)=>(a.play_index||0)-(b.play_index||0));
  if(s.length < 2) return "";
  const {W,H,PL,PR,PT,PB} = _HLG, iw=W-PL-PR, ih=H-PT-PB;
  const xs = s.map(p=>p.play_index||0), xmin=Math.min(...xs), xmax=Math.max(...xs);
  let ymax=1; s.forEach(p=>_HL_METRICS.forEach(([n])=>{ if((+p[n]||0)>ymax) ymax=+p[n]; }));
  const sx = x => PL + (xmax===xmin?0:(x-xmin)/(xmax-xmin))*iw;
  const sy = y => PT + ih - (y/ymax)*ih;
  let lines="", dots="";
  _HL_METRICS.forEach(([n,c])=>{
    lines += '<polyline fill="none" stroke="'+c+'" stroke-width="1.8" opacity=".9" points="'+
      s.map(p=>sx(p.play_index||0).toFixed(1)+","+sy(+p[n]||0).toFixed(1)).join(" ")+'"/>';
    const bb=(node.爆点||{})[_HL_BURST[n]]||{};
    if(bb.play_index && bb.value) dots += '<circle cx="'+sx(bb.play_index).toFixed(1)+'" cy="'+sy(bb.value).toFixed(1)+
      '" r="3.5" fill="'+c+'" stroke="#0f1115" stroke-width="1"/>';
  });
  let ticks="";
  [xmin,(xmin+xmax)/2,xmax].forEach(t=>{ ticks += '<text x="'+sx(t).toFixed(1)+'" y="'+(H-8)+
    '" fill="#8a93a6" font-size="10" text-anchor="middle">'+_hlFmtSec(t)+'</text>'; });
  return '<svg class="hl-svg" viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet"'+
    ' data-xmin="'+xmin+'" data-xmax="'+xmax+'" data-ymax="'+ymax+'">'+
    '<line x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'" stroke="#2a3550" stroke-width="1"/>'+
    '<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+ih)+'" stroke="#2a3550" stroke-width="1"/>'+
    lines+dots+ticks+
    '<line class="hl-cursor" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+ih)+'" stroke="#9dbcff" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>'+
    '<rect class="hl-hit" x="'+PL+'" y="'+PT+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:crosshair"/>'+
    '</svg>';
}

function _hlCardHTML(it){
  const n = it._ref_idx || "";
  const hl = it.highlight||{};
  const who = it["客户简称"]||it["拓品品类名称"]||it["商品类型"]||"";
  const batch = it._batch ? '<span class="hl-batch">'+escapeHTML(it._batch)+'批</span>' : "";
  const legend = _HL_METRICS.map(([n2,c])=>'<span class="hl-lg"><i style="background:'+c+'"></i>'+n2+'</span>').join("");
  const units = _hlParseScript(it.analysis||{});
  const scriptHtml = units.length
    ? units.map(u=>'<span class="hl-su" data-s="'+u.start+'" data-e="'+u.end+'">'+
        escapeHTML(u.start)+"-"+escapeHTML(u.end)+"s "+escapeHTML(u.text)+'</span>').join("")
    : '<span class="hl-muted">（无可解析的分段脚本）</span>';
  const conv = (hl.转化分析||{});
  const reason = conv.转化原因 ? '<div class="hl-reason">🎯 '+escapeHTML(conv.转化原因)+'</div>' : "";
  const bursts = Array.isArray(conv.爆点)&&conv.爆点.length
    ? '<ul class="hl-bursts">'+conv.爆点.map(b=>"<li>"+escapeHTML(b)+"</li>").join("")+'</ul>' : "";
  return '<div class="hl-card" data-md5="'+escapeAttr(it.md5||"")+'">'+
    '<div class="hl-head">'+batch+'<b>#'+escapeHTML(n)+'</b> <span class="hl-who">'+escapeHTML(who)+'</span>'+
      '<span class="hl-cal">近7天日均'+(hl.口径&&hl.口径.video_duration?" · 时长"+escapeHTML(hl.口径.video_duration)+"s":"")+'</span>'+
      '<span class="hl-legend">'+legend+'</span></div>'+
    '<div class="hl-chart">'+_hlChartSVG(hl)+'<div class="hl-tip" style="display:none"></div></div>'+
    reason+bursts+
    '<details class="hl-script" open><summary>📜 完整脚本（与曲线双向联动）</summary><div class="hl-flow">'+scriptHtml+'</div></details>'+
    '</div>';
}

function _wireHlCard(card, items){
  const svg = card.querySelector(".hl-svg"), tip = card.querySelector(".hl-tip");
  const hit = card.querySelector(".hl-hit"), cursor = card.querySelector(".hl-cursor");
  const units = Array.prototype.slice.call(card.querySelectorAll(".hl-su"));
  if(!svg || !hit) return;
  const md5 = card.getAttribute("data-md5");
  const item = (items||[]).find(it=>it.md5===md5) || {};
  const s = (((item.highlight||{}).series)||[]).slice().sort((a,b)=>(a.play_index||0)-(b.play_index||0));
  if(!s.length) return;
  const xmin=+svg.dataset.xmin, xmax=+svg.dataset.xmax;
  const W=_HLG.W, PL=_HLG.PL, iw=W-PL-_HLG.PR;
  function setActive(sec){
    units.forEach(u=>{ const a=+u.dataset.s, b=+u.dataset.e; u.classList.toggle("on", !isNaN(sec)&&sec>=a-0.05&&sec<=b+0.05); });
  }
  function tipHTML(sec, best){
    return '<div class="hl-tip-sec">'+sec.toFixed(1)+'s</div>'+
      _HL_METRICS.map(([n,c])=>'<div class="hl-tip-row"><i style="background:'+c+'"></i>'+n+' <b>'+(+best[n]||0)+'</b></div>').join("");
  }
  hit.addEventListener("mousemove", ev=>{
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left)/r.width*W;
    const frac = Math.max(0, Math.min(1, (px-PL)/iw));
    const pi = xmin + frac*(xmax-xmin);
    let best=s[0], bd=Infinity; s.forEach(p=>{ const d=Math.abs((p.play_index||0)-pi); if(d<bd){bd=d;best=p;} });
    const sec = (best.play_index||0)/1000;
    cursor.style.display="block";
    const cx = PL + (xmax===xmin?0:((best.play_index||0)-xmin)/(xmax-xmin))*iw;
    cursor.setAttribute("x1",cx.toFixed(1)); cursor.setAttribute("x2",cx.toFixed(1));
    tip.style.display="block";
    tip.style.left = Math.min(r.width-150, Math.max(0, (cx/W)*r.width - 40))+"px";
    tip.innerHTML = tipHTML(sec, best);
    setActive(sec);
  });
  hit.addEventListener("mouseleave", ()=>{ tip.style.display="none"; cursor.style.display="none"; setActive(NaN); });
  // 反向联动：悬停脚本句 → 曲线定位
  function cursorAtSec(sec){
    const pi = sec*1000;
    const cx = PL + (xmax===xmin?0:(pi-xmin)/(xmax-xmin))*iw;
    cursor.style.display="block";
    cursor.setAttribute("x1",cx.toFixed(1)); cursor.setAttribute("x2",cx.toFixed(1));
    let best=s[0], bd=Infinity; s.forEach(p=>{ const d=Math.abs((p.play_index||0)-pi); if(d<bd){bd=d;best=p;} });
    const r = svg.getBoundingClientRect();
    tip.style.display="block";
    tip.style.left = Math.min(r.width-150, Math.max(0, (cx/W)*r.width - 40))+"px";
    tip.innerHTML = tipHTML(sec, best);
  }
  units.forEach(u=>{
    u.addEventListener("mouseenter", ()=>{ u.classList.add("on"); cursorAtSec((+u.dataset.s + +u.dataset.e)/2); });
    u.addEventListener("mouseleave", ()=>{ u.classList.remove("on"); tip.style.display="none"; cursor.style.display="none"; });
  });
}

function renderHighlightSection(items){
  const withHl = (items||[]).filter(it => (((it.highlight||{}).series)||[]).length >= 2);
  if(!withHl.length) return;
  const sec = document.createElement("section");
  sec.className = "hl-section";
  sec.innerHTML = '<h2 style="border-left:3px solid #4f8cff;padding-left:10px;margin:28px 0 14px">'+
      '📈 高光时序数据 &amp; 转化点（基于真实播放进度）</h2>'+
    '<div class="hl-note">曲线与完整脚本双向联动：悬停曲线看该秒数值并高亮对应脚本句，悬停脚本句在曲线上定位。'+
      '仅对带「账户ID + md5」的素材可拉取，故此处只列出 '+withHl.length+' 条。</div>'+
    '<div class="hl-grid">'+withHl.map(_hlCardHTML).join("")+'</div>';
  document.getElementById("content").appendChild(sec);
  sec.querySelectorAll(".hl-card").forEach(c=>_wireHlCard(c, items));
}

document.addEventListener("DOMContentLoaded", function(){
  marked.setOptions({gfm: true, breaks: false});
  const html = marked.parse(REPORT_MD || "");
  document.getElementById("content").innerHTML = replaceHashRefs(html, ITEMS || []);
  try { renderHighlightSection(ITEMS || []); } catch(e){ console.warn("highlight render failed", e); }
});
