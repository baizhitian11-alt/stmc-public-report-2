<script>const REPORT_MD = "# 燕窝涂抹面膜（A批）vs 谷雨涂抹面膜（B批）素材对比分析最终报告\n\n> **整合分析 · 16条素材全量对比 · 2026年8月**\n\n---\n\n## 1. 数据全景：16条素材核心指标对比\n\n### 1.1 A批（WIS燕窝涂抹面膜）8条素材汇总\n\n| 编号 | 消耗(元) | CTR(%) | 浅层CVR(%) | 下单ROI | 3s完播(%) | 下单单价(元) |\n|:---:|:---:|:---:|:---:|:---:|:---:|:---:|\n| #1 | 0.78 | 4.43 | 3.87 | 2.08 | 49.75 | 101.95 |\n| #2 | 0.15 | 10.91 | 0.69 | 2.33 | 60.32 | 91.14 |\n| #3 | 0.14 | 6.13 | 0.54 | 2.76 | 57.65 | 90.00 |\n| #4 | 0.13 | 8.41 | 1.92 | 2.76 | 52.89 | 100.59 |\n| #5 | 0.13 | 4.28 | 0.33 | 0.93 | 70.37 | 129.00 |\n| #6 | 0.12 | 6.94 | 1.04 | 3.33 | 50.41 | 91.12 |\n| #7 | 0.12 | 5.27 | 5.54 | 1.75 | 53.71 | 123.71 |\n| #8 | 0.10 | 5.01 | 0.56 | 2.68 | 59.20 | 88.90 |\n| **均值** | **0.21** | **6.42** | **1.81** | **2.33** | **56.79** | **102.05** |\n\n### 1.2 B批（谷雨涂抹面膜）8条素材汇总\n\n| 编号 | 消耗(元) | CTR(%) | 浅层CVR(%) | 下单ROI | 3s完播(%) | 下单单价(元) |\n|:---:|:---:|:---:|:---:|:---:|:---:|:---:|\n| #9 | 8.05 | 1.16 | 10.37 | 1.75 | 15.04 | 297.83 |\n| #10 | 3.32 | 1.64 | 11.80 | 1.78 | 31.65 | 472.62 |\n| #11 | 3.03 | 1.32 | 12.44 | 1.85 | 25.36 | 300.89 |\n| #12 | 2.40 | 1.34 | 12.98 | 1.80 | 21.18 | 302.13 |\n| #13 | 2.18 | 0.81 | 14.29 | 1.62 | 32.07 | 297.40 |\n| #14 | 1.82 | 1.94 | 14.37 | 1.91 | 45.98 | 477.66 |\n| #15 | 1.79 | 2.89 | 15.07 | 2.24 | 29.85 | 506.91 |\n| #16 | 1.53 | 2.09 | 9.45 | 2.04 | 50.03 | 302.96 |\n| **均值** | **3.02** | **1.65** | **12.60** | **1.87** | **31.40** | **369.80** |\n\n### 1.3 两批核心指标差距一览\n\n| 指标 | A批均值 | B批均值 | B/A倍数 |\n|:---|:---:|:---:|:---:|\n| 总消耗(元) | 1.67 | 24.12 | **14.4倍** |\n| 单条均消耗(元) | 0.21 | 3.02 | **14.4倍** |\n| CTR(%) | 6.42 | 1.65 | 0.26倍 |\n| 浅层CVR(%) | 1.81 | 12.60 | **7.0倍** |\n| 下单ROI | 2.33 | 1.87 | 0.80倍 |\n| 3s完播(%) | 56.79 | 31.40 | 0.55倍 |\n| 下单单价(元) | 102.05 | 369.80 | **3.6倍** |\n\n**核心发现**：A批在CTR和3s完播率上全面领先，但B批以7倍的浅层CVR优势和14倍的消耗规模碾压式胜出。两批素材的ROI差距不大（A批2.33 vs B批1.87），但B批以3.6倍客单价实现了相近的ROI，说明其用户价值远高于A批。\n\n---\n\n## 2. 五大核心败因深度剖析\n\n### 2.1 消耗能力：系统放量意愿的天壤之别\n\nA批8条素材总消耗仅1.67元，单条最高0.78元（#1），最低仅0.10元（#8），素材几乎无法获得系统放量。B批总消耗24.12元，单条最高8.05元（#9），最低也有1.53元（#16），系统持续给予流量倾斜。\n\n**根本原因**：ecpm竞价公式中，浅层CVR是核心权重因子。B批12.60%的浅层CVR意味着每100次点击产生12.6次转化行为，而A批仅1.81次。系统判定B批素材的流量变现效率更高，因此持续放量。A批的高CTR（6.42%）虽然带来了更多点击，但低转化率反而拉低了ecpm，形成\"点击多→转化少→ecpm低→消耗少\"的恶性循环。\n\n### 2.2 转化效率：从\"看热闹\"到\"下单\"的致命断层\n\nA批的转化漏斗呈现典型的\"头重脚轻\"特征：CTR高达6.42%（#2甚至达到10.91%），3s完播率56.79%（#5高达70.37%），但浅层CVR断崖式下跌至1.81%。这意味着大量用户被素材吸引点击观看，却在转化环节流失。\n\nB批则呈现相反的\"精准筛选\"模式：CTR仅1.65%，3s完播率31.40%，但浅层CVR高达12.60%（#15达到15.07%）。低CTR说明素材主动过滤了非目标用户，留下来点击的都是高意向人群，转化效率自然极高。\n\n**关键素材佐证**：#5（A批）以70.37%的完播率全场最高，但浅层CVR仅0.33%，下单ROI仅0.93——用户看完了但完全不买。#15（B批）以15.07%的浅层CVR全场最高，ROI达2.24——精准筛选策略的典型成功案例。\n\n### 2.3 人群锚定：泛人群撒网 vs 精准狙击\n\nA批素材的人群策略是\"泛熟龄肌女性\"，话术如\"26年不用买面膜\"（#1）、\"穿得再漂亮也没用\"（#5），试图覆盖尽可能广泛的女性用户。这种策略虽然拉高了CTR，但吸引来的大量用户并无明确购买意向。\n\nB批则反复使用\"30+\"（#9、#11）、\"断崖式衰老\"（#9）、\"松垮皱纹\"（#11）等精准年龄标签，直接筛选出有抗老刚需的核心人群。素材#9的开篇话术\"30岁以后断崖式衰老\"本质上是一道人群过滤器——不关心抗老的用户直接划走，留下来的都是精准潜在客户。\n\n### 2.4 价值感知：低价促销 vs 高端溢价\n\nA批的价格策略集中在\"一顿火锅价\"（#1）、\"全场一折\"（#5）、\"宠粉福利\"（#8）等低价促销话术，客单价被压制在88-129元区间。这种策略虽然降低了决策门槛，但也严重拉低了品牌溢价空间，且\"宠粉福利\"类模糊话术缺乏具体利益点，用户感知价值低。\n\nB批则构建了完整的高端价值体系：话术上使用\"除了贵没缺点\"（#9）、\"比海蓝之谜还好吸收\"（#13）锚定高端对标；促销上明确\"拍一送一24颗到手\"（#10、#12）给出具体利益；成分上引入\"诺奖黑科技\"\"细胞级\"（#14、#16）等科技概念支撑溢价。最终客单价达到302-507元，是A批的3.6倍。\n\n### 2.5 概念差异化：传统滋补 vs 科技抗老\n\nA批的核心概念是\"燕窝滋养\"，属于传统滋补赛道。这一概念在护肤品市场已被大量使用，缺乏辨识度和记忆点。素材#1、#3、#7虽然尝试用3D科技感画面包装，但概念内核仍是\"燕窝酸滋养\"，与竞品难以区隔。\n\nB批则构建了\"冰敷抗老冻膜\"的独特概念体系：冰箱取物仪式感（#9、#11）、\"冰敷紧致淡纹\"功能锚点（#11）、\"细胞级科技\"成分背书（#14、#16）。这一概念同时占据了\"视觉记忆点\"（冰箱取物）和\"功能差异化\"（冰敷紧致）两个维度，形成了竞品难以复制的认知壁垒。\n\n---\n\n## 3. 综合素材排序TOP 5\n\n| 排名 | 编号 | 批次 | 消耗(元) | 浅层CVR(%) | 下单ROI | 推荐理由 |\n|:---:|:---:|:---:|:---:|:---:|:---:|:---|\n| 🥇 | #15 | B | 1.79 | 15.07 | 2.24 | 浅层CVR全场最高，ROI达2.24，精准筛选策略标杆，**建议加投** |\n| 🥈 | #14 | B | 1.82 | 14.37 | 1.91 | 浅层CVR全场第二，ROI环比+18.65%，细胞级概念差异化强，**建议复制迭代** |\n| 🥉 | #11 | B | 3.03 | 12.44 | 1.85 | 3s完播环比+14%，冰箱取物仪式感概念独特，**建议作为创意模板** |\n| 4 | #9 | B | 8.05 | 10.37 | 1.75 | 消耗最高验证跑量能力，\"断崖式衰老\"话术精准，**适合作为基本盘** |\n| 5 | #6 | A | 0.12 | 1.04 | 3.33 | ROI全场最高3.33，但消耗极低需优化人群定向和转化链路后测试放量 |\n\n---\n\n## 4. A批向B批学习的四大改进方向\n\n### 4.1 人群策略：从\"泛熟龄\"收缩为\"30+精准抗老\"\n\n借鉴#9、#11的年龄标签策略，在素材开篇即用\"30岁以后\"\"松垮皱纹\"\"断崖式衰老\"等话术筛选精准人群。宁可牺牲CTR，也要确保点击用户的高意向度。\n\n### 4.2 概念升级：构建\"燕窝冰敷\"差异化概念\n\n将A批的\"燕窝滋养\"与B批的\"冰敷仪式感\"融合，打造\"燕窝冰敷冻膜\"新概念。素材可参考#11的冰箱取物视觉呈现，叠加#1、#7的3D科技感画面，形成\"传统成分+现代科技+仪式感体验\"的三重差异化。\n\n### 4.3 价值体系：从\"低价促销\"升级为\"高端对标\"\n\n参考#13\"比海蓝之谜还好吸收\"的对标策略和#10\"拍一送一24颗\"的具体利益点，将A批模糊的\"宠粉福利\"替换为明确的高端价值锚定和具体促销机制，支撑客单价从100元向200-300元区间提升。\n\n### 4.4 转化链路：从\"直接下单\"转向\"直播间承接\"\n\nB批素材普遍引导用户进入直播间（#10、#12、#14），利用主播实时答疑和限时优惠促成转化。A批素材多为落地页直接下单，缺乏中间信任建立环节。建议A批素材增加直播间引导组件，延长用户决策链路中的品牌接触点。\n\n---\n\n## 5. 核心结论\n\n**一句话总结**：WIS燕窝涂抹面膜（A批）赢在\"让人停下来看\"（高CTR、高完播），谷雨涂抹面膜（B批）赢在\"让人看完买\"（高CVR、高消耗）——在效果广告的竞价逻辑中，转化效率比点击率更具决定性，精准筛选比广泛撒网更能驱动系统放量。\n\nA批素材的CTR均值是B批的3.9倍（6.42% vs 1.65%），3s完播率是B批的1.8倍（56.79% vs 31.40%），但浅层CVR仅为B批的1/7（1.81% vs 12.60%），消耗规模仅为B批的1/14（1.67元 vs 24.12元）。这组数据清晰地揭示了一个残酷事实：**在腾讯广告的ecpm竞价体系下，高点击低转化的素材会被系统判定为\"流量浪费者\"而减少放量，低点击高转化的素材则被识别为\"流量高效利用者\"而获得持续加注**。\n\nA批若想逆袭，核心不在于提升CTR（已经足够高），而在于用B批的精准人群筛选逻辑重构素材策略——用年龄标签过滤泛人群、用差异化概念建立记忆点、用高端对标支撑客单价、用直播间承接延长转化链路。唯有从\"吸引眼球\"转向\"筛选意向\"，才能打破当前的消耗天花板。";

冰敷』\n52-60s：旁白：『10点睡一周一次，12点睡一周两次，3点睡一周三次。每次敷都像是在给皮肤做美缝一样，指哪打哪的感觉』(字幕：黄金修护三角体系)\n60-65s：秦海璐：『真的不要太爽。现在知道我秦海璐不是骗子了吧。这个产品真的是又便宜又好用』\n65-76s：素人：『本来我是不信的，但是我看大家都跟不要钱似的抢，我也没忍住跟风买了。真的有被惊喜到啊。看我这脸是不是有点透有点亮，跟那嫩豆腐似的，都能掐出水了』\n76-83s：达人：『用完了以后你就会发现，哇塞，我的脸怎么可以这么白，这么嫩。燕窝面膜用的早，这人是真的不显老』\n83-89s：旁白：『这种好东西就要趁着活动多囤一点。现在WIS福利大促，全场一折，快来看看吧』(产品礼盒展示)"}}, {"md5": "90cde6da733c84baaa56175b08f3745e", "video_url": "http://adsmind.gdtimg.com/ads_svp_video__0bc3ceakaaaavqagoocmyzvbueieuaiqbica.f0.mp4?dis_k=da3a3da42b81fb51bed2519378dc435f&dis_t=1783416846&m=90cde6da733c84baaa56175b08f3745e&sha256=aec332428debed19ea723c643e79e32fea81da340ee62d0687b9d04a17fad00a", "客户简称": "", "拓品品类名称": "", "商品类型": "", "_ref_idx": 8, "_cover_url": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD//gAPTGF2YzYxLjMuMTAwAP/bAEMACAYGBwYHCAgICAgICQkJCgoKCQkJCQoKCgoKCgwMDAoKCgoKCgoMDAwMDQ4NDQ0MDQ4ODw8PEhIRERUVFRkZH//EAKcAAAEFAQEBAAAAAAAAAAAAAAUEAgMGAQcACAEAAwEBAQAAAAAAAAAAAAAAAAECAwQFEAACAQMDAQUEBwUECAUFAQEBAgMABBEFIRIxQQYiE1EycWEUobFSQiORgRXBB9FicoIzJPAW4VOSk6JD0vE0Y1Qlc8KDskRFEQACAgICAQQCAgEEAwEBAAAAAQIRIQMSMUFRBGETMiJxgRQjUpGhM/DRsUL/wAARCAKAAWgDASIAAhEAAxEA/9oADAMBAAIRAxEAPwDnanOzD3Vsb8WrFYE14FR8a4aNrLEmsQ3UknmWlrAZ0hjEkfOOOB0Ycp+AJHiHtr07RUveRI2vPClqvCOONjaNyglKLjzk9OY3I9arHmVZO7dmmpO8bMpeGFrhYX5YmWLd4gy+yeOSKzlFo1hKwP5KhgewVYrTWpD8nFd5uYLXKJGx4t5TnJTmN9uw9lBLwLHds8UZ8iRiUUb8ATnic77dKx7j+gilSkjW6LZd6Q89v54hdU5LwbGdnJ4+8Hpn1okLopoU+nTrNHNFdJNATkDbCuu+Dsc9PWk/dzvZG9sbLUgZ444eNry28tkOVRwCOS56Z6Uq1aC6MVtc3Dh47pC8ZDZxjAOR2E7Z9ax3YtI0g+TSeKEuj2cuoNNBHMkRaJ28bYDcR7P61z7UpGV2THFgxBHpg4rrGmaVc6a73GEuImsjIyqd3hmBU8M7ll7cdK5HqayRXMqShgwc+1167E+8VWiKwLdJO66ExDMABuaaM5waejFSCDvTnhk64zmumzjY+3uGhOAvIDJpQ85ZC+N3HEjqKTR+D2ticdvZUrXOGK8QEx1qGBAkZ5DOwqaWAHH101JlkbpgetSPJtiiwE/lcd66BoZttS066srW5dAYyW8xOHy2EVfmHbkeSykmN1TswTVALEU5vOtgkhDxiVTxO45r0PTqKUo8ioS4jSp5FdvCSDjpscVBMyx7VqyshzUJDStWkcIynltksTArjOxqK4iXgw+8V2x2VG/4J2NOQ8hkmnbTIBv7Omk3ZlFTQ6YEH4gB9MUvUoG8RwAM5xmlUskbAADGfq9ar7ZAAXs0EUgA8fYaFEEdatJiVmxkUPutLdpiQRx23rTXt/3ABKcXY7 <script>
function escapeAttr(s){return String(s==null?"":s).replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function _buildRef(n, items){
  const idxToItem = new Map();
  items.forEach((it, i) => idxToItem.set((it && it._ref_idx) || (i + 1), it));
  const it = idxToItem.get(n);
  if(!it) return '<span class="ref-miss">#'+n+'</span>';
  const md5 = it.md5 || "";
  const isValidMd5 = md5 && /^[0-9a-fA-F]{32}$/.test(md5);
  const cover = it._cover_url || "";
  const vurl = (it.video_url || "").replace(/"/g, "%22").replace(/'/g, "%27");
  const title = ('#'+n+' '+(it["客户简称"]||"")+' '+(it["拓品品类名称"]||it["商品类型"]||"")).trim();
  const thumb = cover ? '<img class="ref-thumb" src="'+escapeAttr(cover)+'" loading="lazy" alt="#'+n+'" onerror="this.style.display=\'none\'"/>' : "";
  if(vurl){ return '<a class="ref" href="'+escapeAttr(vurl)+'" target="_blank" rel="noopener" title="'+escapeAttr(title)+'"><span class="ref-num">#'+n+'</span>'+thumb+'</a>'; }
  return '<span class="ref" title="'+escapeAttr(title)+'"><span class="ref-num">#'+n+'</span>'+thumb+'</span>';
}
function replaceHashRefs(input, items){
  if(!input || !items || !items.length) return input || "";
  const replaceInText = (text) => text.replace(/#(\d+)\b/g, (_, nStr) => _buildRef(parseInt(nStr, 10), items));
  return String(input).split(/(<[^>]+>)/g).map((seg) => seg.startsWith("<") ? seg : replaceInText(seg)).join("");
}

function escapeHTML(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const _HL_METRICS = [["点击","#4f8cff"],["点赞","#22c55e"],["转发","#f59e0b"],["流失","#ef4444"]];
const _HL_BURST = {"点击":"点击爆点","点赞":"点赞爆点","转发":"转发爆点","流失":"最大流失点"};
const _HLG = {W:560,H:180,PL:40,PR:14,PT:14,PB:26};

function _hlFmtSec(ms){ ms=+ms||0; return ms>=1000 ? (ms%1000?(ms/1000).toFixed(1):(ms/1000|0))+"s" : (ms|0)+"ms"; }

// 把「完整脚本」按 "0-3s：xxx" / "3~8秒 xxx" 切成带起止秒的句子单元
function _hlParseScript(analysis){
  const full = String((analysis&&(analysis.完整脚本||analysis.脚本拆解))||"");
  const units = [];
  const re = /(?:^|\n)\s*[-*#>\d.、]*\s*(\d+(?:\.\d+)?)\s*(?:s|秒)?\s*(?:-|~|～|至|到)\s*(\d+(?:\.\d+)?)\s*(?:s|秒)?\s*[：:]?\s*([^\n]+)/gi;
  let m;
  while((m = re.exec(full))){
    units.push({start:+m[1], end:+m[2], text:m[3].replace(/\s+/g," ").replace(/^[-*：:\s]+/,"").trim()});
  }
  return units;
}

function _hlChartSVG(node){
  const s = (node.series||[]).slice().sort((a,b)=>(a.play_index||0)-(b.play_index||0));
  if(s.length < 2) return "";
  const {W,H,PL,PR,PT,PB} = _HLG, iw=W-PL-PR, ih=H-PT-PB;
  const xs = s.map(p=>p.play_index||0), xmin=Math.min(...xs), xmax=Math.max(...xs);
  let ymax=1; s.forEach(p=>_HL_METRICS.forEach(([n])=>{ if((+p[n]||0)>ymax) ymax=+p[n]; }));
  const sx = x => PL + (xmax===xmin?0:(x-xmin)/(xmax-xmin))*iw;
  const sy = y => PT + ih - (y/ymax)*ih;
  let lines="", dots="";
  _HL_METRICS.forEach(([n,c])=>{
    lines += '<polyline fill="none" stroke="'+c+'" stroke-width="1.8" opacity=".9" points="'+
      s.map(p=>sx(p.play_index||0).toFixed(1)+","+sy(+p[n]||0).toFixed(1)).join(" ")+'"/>';
    const bb=(node.爆点||{})[_HL_BURST[n]]||{};
    if(bb.play_index && bb.value) dots += '<circle cx="'+sx(bb.play_index).toFixed(1)+'" cy="'+sy(bb.value).toFixed(1)+
      '" r="3.5" fill="'+c+'" stroke="#0f1115" stroke-width="1"/>';
  });
  let ticks="";
  [xmin,(xmin+xmax)/2,xmax].forEach(t=>{ ticks += '<text x="'+sx(t).toFixed(1)+'" y="'+(H-8)+
    '" fill="#8a93a6" font-size="10" text-anchor="middle">'+_hlFmtSec(t)+'</text>'; });
  return '<svg class="hl-svg" viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet"'+
    ' data-xmin="'+xmin+'" data-xmax="'+xmax+'" data-ymax="'+ymax+'">'+
    '<line x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'" stroke="#2a3550" stroke-width="1"/>'+
    '<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+ih)+'" stroke="#2a3550" stroke-width="1"/>'+
    lines+dots+ticks+
    '<line class="hl-cursor" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+ih)+'" stroke="#9dbcff" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>'+
    '<rect class="hl-hit" x="'+PL+'" y="'+PT+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:crosshair"/>'+
    '</svg>';
}

function _hlCardHTML(it){
  const n = it._ref_idx || "";
  const hl = it.highlight||{};
  const who = it["客户简称"]||it["拓品品类名称"]||it["商品类型"]||"";
  const batch = it._batch ? '<span class="hl-batch">'+escapeHTML(it._batch)+'批</span>' : "";
  const legend = _HL_METRICS.map(([n2,c])=>'<span class="hl-lg"><i style="background:'+c+'"></i>'+n2+'</span>').join("");
  const units = _hlParseScript(it.analysis||{});
  const scriptHtml = units.length
    ? units.map(u=>'<span class="hl-su" data-s="'+u.start+'" data-e="'+u.end+'">'+
        escapeHTML(u.start)+"-"+escapeHTML(u.end)+"s "+escapeHTML(u.text)+'</span>').join("")
    : '<span class="hl-muted">（无可解析的分段脚本）</span>';
  const conv = (hl.转化分析||{});
  const reason = conv.转化原因 ? '<div class="hl-reason">🎯 '+escapeHTML(conv.转化原因)+'</div>' : "";
  const bursts = Array.isArray(conv.爆点)&&conv.爆点.length
    ? '<ul class="hl-bursts">'+conv.爆点.map(b=>"<li>"+escapeHTML(b)+"</li>").join("")+'</ul>' : "";
  return '<div class="hl-card" data-md5="'+escapeAttr(it.md5||"")+'">'+
    '<div class="hl-head">'+batch+'<b>#'+escapeHTML(n)+'</b> <span class="hl-who">'+escapeHTML(who)+'</span>'+
      '<span class="hl-cal">近7天日均'+(hl.口径&&hl.口径.video_duration?" · 时长"+escapeHTML(hl.口径.video_duration)+"s":"")+'</span>'+
      '<span class="hl-legend">'+legend+'</span></div>'+
    '<div class="hl-chart">'+_hlChartSVG(hl)+'<div class="hl-tip" style="display:none"></div></div>'+
    reason+bursts+
    '<details class="hl-script" open><summary>📜 完整脚本（与曲线双向联动）</summary><div class="hl-flow">'+scriptHtml+'</div></details>'+
    '</div>';
}

function _wireHlCard(card, items){
  const svg = card.querySelector(".hl-svg"), tip = card.querySelector(".hl-tip");
  const hit = card.querySelector(".hl-hit"), cursor = card.querySelector(".hl-cursor");
  const units = Array.prototype.slice.call(card.querySelectorAll(".hl-su"));
  if(!svg || !hit) return;
  const md5 = card.getAttribute("data-md5");
  const item = (items||[]).find(it=>it.md5===md5) || {};
  const s = (((item.highlight||{}).series)||[]).slice().sort((a,b)=>(a.play_index||0)-(b.play_index||0));
  if(!s.length) return;
  const xmin=+svg.dataset.xmin, xmax=+svg.dataset.xmax;
  const W=_HLG.W, PL=_HLG.PL, iw=W-PL-_HLG.PR;
  function setActive(sec){
    units.forEach(u=>{ const a=+u.dataset.s, b=+u.dataset.e; u.classList.toggle("on", !isNaN(sec)&&sec>=a-0.05&&sec<=b+0.05); });
  }
  function tipHTML(sec, best){
    return '<div class="hl-tip-sec">'+sec.toFixed(1)+'s</div>'+
      _HL_METRICS.map(([n,c])=>'<div class="hl-tip-row"><i style="background:'+c+'"></i>'+n+' <b>'+(+best[n]||0)+'</b></div>').join("");
  }
  hit.addEventListener("mousemove", ev=>{
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left)/r.width*W;
    const frac = Math.max(0, Math.min(1, (px-PL)/iw));
    const pi = xmin + frac*(xmax-xmin);
    let best=s[0], bd=Infinity; s.forEach(p=>{ const d=Math.abs((p.play_index||0)-pi); if(d<bd){bd=d;best=p;} });
    const sec = (best.play_index||0)/1000;
    cursor.style.display="block";
    const cx = PL + (xmax===xmin?0:((best.play_index||0)-xmin)/(xmax-xmin))*iw;
    cursor.setAttribute("x1",cx.toFixed(1)); cursor.setAttribute("x2",cx.toFixed(1));
    tip.style.display="block";
    tip.style.left = Math.min(r.width-150, Math.max(0, (cx/W)*r.width - 40))+"px";
    tip.innerHTML = tipHTML(sec, best);
    setActive(sec);
  });
  hit.addEventListener("mouseleave", ()=>{ tip.style.display="none"; cursor.style.display="none"; setActive(NaN); });
  // 反向联动：悬停脚本句 → 曲线定位
  function cursorAtSec(sec){
    const pi = sec*1000;
    const cx = PL + (xmax===xmin?0:(pi-xmin)/(xmax-xmin))*iw;
    cursor.style.display="block";
    cursor.setAttribute("x1",cx.toFixed(1)); cursor.setAttribute("x2",cx.toFixed(1));
    let best=s[0], bd=Infinity; s.forEach(p=>{ const d=Math.abs((p.play_index||0)-pi); if(d<bd){bd=d;best=p;} });
    const r = svg.getBoundingClientRect();
    tip.style.display="block";
    tip.style.left = Math.min(r.width-150, Math.max(0, (cx/W)*r.width - 40))+"px";
    tip.innerHTML = tipHTML(sec, best);
  }
  units.forEach(u=>{
    u.addEventListener("mouseenter", ()=>{ u.classList.add("on"); cursorAtSec((+u.dataset.s + +u.dataset.e)/2); });
    u.addEventListener("mouseleave", ()=>{ u.classList.remove("on"); tip.style.display="none"; cursor.style.display="none"; });
  });
}

function renderHighlightSection(items){
  const withHl = (items||[]).filter(it => (((it.highlight||{}).series)||[]).length >= 2);
  if(!withHl.length) return;
  const sec = document.createElement("section");
  sec.className = "hl-section";
  sec.innerHTML = '<h2 style="border-left:3px solid #4f8cff;padding-left:10px;margin:28px 0 14px">'+
      '📈 高光时序数据 &amp; 转化点（基于真实播放进度）</h2>'+
    '<div class="hl-note">曲线与完整脚本双向联动：悬停曲线看该秒数值并高亮对应脚本句，悬停脚本句在曲线上定位。'+
      '仅对带「账户ID + md5」的素材可拉取，故此处只列出 '+withHl.length+' 条。</div>'+
    '<div class="hl-grid">'+withHl.map(_hlCardHTML).join("")+'</div>';
  document.getElementById("content").appendChild(sec);
  sec.querySelectorAll(".hl-card").forEach(c=>_wireHlCard(c, items));
}

document.addEventListener("DOMContentLoaded", function(){
  marked.setOptions({gfm: true, breaks: false});
  const html = marked.parse(REPORT_MD || "");
  document.getElementById("content").innerHTML = replaceHashRefs(html, ITEMS || []);
  try { renderHighlightSection(ITEMS || []); } catch(e){ console.warn("highlight render failed", e); }
});
</script>
